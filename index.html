<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holy Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#242a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holy Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef0f8;--surface:#fff;--ink:#1d2144;--muted:#6a6f92;--line:#dcdff0;--dev:#c88a1e;--cel:#2f8f83;--cul:#7b4fa3;--dis:#2f6fbf;--ora:#b8456b;--night:#242a5c;--night2:#3b3f86;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--surface:#1c1f3d;--ink:#eceefb;--muted:#9a9fc6;--line:#2c3060;--night:#0d0f24;--night2:#2a2e66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142b;--surface:#1c1f3d;--ink:#eceefb;--muted:#9a9fc6;--line:#2c3060;--night:#0d0f24;--night2:#2a2e66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;line-height:1.2}
#app{max-width:560px;margin:0 auto;padding:0 18px 110px}
.hero{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;margin:0 -18px;padding:34px 22px 40px;border-radius:0 0 28px 28px}
.hero h1{font-size:34px}
.hero p{margin:8px 0 0;color:#c9cdf5;font-style:italic;font-family:Newsreader,Georgia,serif;font-size:18px}
.sec{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:16px;margin-top:14px;color:inherit;font:inherit;cursor:pointer}
.sec .ic{font-size:26px}
.sec b{display:block;font-family:Newsreader,Georgia,serif;font-size:21px}
.sec small{color:var(--muted)}
.sec .n{margin-left:auto;font-weight:600;color:var(--c);font-size:20px}
h2.t{font-size:22px;margin:26px 0 4px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer;display:block;width:100%;text-align:left;color:inherit;font:inherit}
.rec .d{font-size:13px;color:var(--muted)}
.rec b{font-family:Newsreader,Georgia,serif;font-size:18px;display:block;color:var(--c)}
.rec p{margin:4px 0 0;color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.back{background:none;border:0;font-size:26px;color:var(--ink);cursor:pointer;padding:4px 8px 4px 0}
.bar h1{font-size:26px;color:var(--c)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--c,var(--night2));outline-offset:1px}
label{display:block;font-weight:600;margin:16px 0 6px;font-size:15px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--c);color:#fff;border:0;border-radius:30px;padding:15px 24px;font:600 16px Figtree,sans-serif;box-shadow:0 6px 18px rgba(20,22,60,.35);cursor:pointer}
.btn{width:100%;background:var(--c,var(--night2));color:#fff;border:0;border-radius:14px;padding:15px;font:600 16px Figtree,sans-serif;margin-top:22px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.btn.del{background:transparent;color:#c0392b;border:1.5px solid #e3b5ae}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.field{margin-top:18px}.field h3{font-size:16px;color:var(--c);margin-bottom:4px}
.field p{margin:0;white-space:pre-wrap}
.tools{display:flex;gap:10px;margin-top:26px}.tools .btn{margin-top:0;font-size:14px;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--night);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var TYPES={
 devocional:{label:'Devocional',desc:'Seu tempo diário com Deus',ic:'📖',c:'var(--dev)',title:function(r){return r.versiculo||'Devocional'},sub:'entendi',
  fields:[['data','Data','date'],['versiculo','Versículo-chave','text'],['entendi','O que eu entendi','area'],['arrependo','O que eu me arrependo','area'],['mudar','O que vai mudar daqui pra frente','area']]},
 celula:{label:'Palavra da Célula e GC',desc:'Para aplicar na próxima reunião',ic:'🏠',c:'var(--cel)',title:function(r){return r.tema||'Célula'},sub:'desenvolvimento',
  fields:[['data','Data','date'],['tema','Tema','text'],['responsavel','Responsável por aplicar a palavra','text'],['desenvolvimento','Desenvolvimento da palavra','area'],['aplicacao','Dinâmica (quebra-gelo)','area']]},
 discipulado:{label:'Palavra do discipulado',desc:'O que você recebeu e vai aplicar',ic:'🤝',c:'var(--dis)',title:function(r){return r.tema||'Discipulado'},sub:'desenvolvimento',
  fields:[['data','Data','date'],['tema','Tema','text'],['responsavel','Responsável por aplicar a palavra','text'],['desenvolvimento','Desenvolvimento da palavra','area'],['aplicacao','Observações','area']]},
 culto:{label:'Palavra do culto',desc:'Suas anotações da pregação',ic:'🕊️',c:'var(--cul)',title:function(r){return r.texto||r.pregador||'Culto'},sub:'anotacoes',
  fields:[['data','Data','date'],['pregador','Pregador','text'],['texto','Texto bíblico','text'],['anotacoes','Anotações da pregação','area'],['levar','O que vou levar para a vida','area']]},
 oracao:{label:'Oração',desc:'Registre suas orações',ic:'🙏',c:'var(--ora)',title:function(r){return 'Oração'},sub:'pedido',
  fields:[['data','Data','date'],['pedido','Pedido ou oração específica','area']]}
};
var KEY='momentos-com-deus:v1',db={devocional:[],celula:[],discipulado:[],culto:[],oracao:[]},view={n:'home'},q='';
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);for(var k in db)db[k]=o[k]||[]}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Não foi possível salvar neste navegador.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){if(!d)return'Sem data';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function go(n,t,id){view={n:n,t:t,id:id};q='';render();window.scrollTo(0,0)}
function sorted(t){return db[t].slice().sort(function(a,b){return (b.data||'').localeCompare(a.data||'')||b.id-a.id})}
function render(){
 var a=document.getElementById('app'),T=TYPES[view.t],h='';
 if(view.n==='home'){
  h='<div class="hero"><h1>Holy Notes</h1><p>Guarde o que Deus falou com você.</p></div>';
  for(var k in TYPES){h+='<button class="sec" style="--c:'+TYPES[k].c+'" onclick="go(\'list\',\''+k+'\')"><span class="ic">'+TYPES[k].ic+'</span><span><b>'+TYPES[k].label+'</b><small>'+TYPES[k].desc+'</small></span><span class="n">'+db[k].length+'</span></button>'}
  var all=[];for(var k2 in db)db[k2].forEach(function(r){all.push([k2,r])});
  all.sort(function(x,y){return (y[1].data||'').localeCompare(x[1].data||'')||y[1].id-x[1].id});
  h+='<h2 class="t">Últimos registros</h2>';
  if(!all.length)h+='<div class="empty">Nada por aqui ainda. Escolha uma seção e crie seu primeiro registro.</div>';
  all.slice(0,4).forEach(function(p){h+=card(p[0],p[1])});
  h+='<div class="tools"><button class="btn alt" onclick="backup()">Salvar backup</button><button class="btn alt" onclick="document.getElementById(\'imp\').click()">Restaurar backup</button></div><input id="imp" type="file" accept=".json" hidden onchange="restore(this)">';
 }else if(view.n==='list'){
  var rs=sorted(view.t).filter(function(r){return !q||JSON.stringify(r).toLowerCase().indexOf(q.toLowerCase())>-1});
  h='<div style="--c:'+T.c+'"><div class="bar"><button class="back" aria-label="Voltar" onclick="go(\'home\')">‹</button><h1>'+T.label+'</h1></div>';
  h+='<input type="search" id="q" placeholder="Buscar por palavra-chave" value="'+esc(q)+'" oninput="q=this.value;list()">';
  h+='<div id="res"></div><button class="fab" onclick="go(\'form\',\''+view.t+'\')">+ Novo registro</button></div>';
 }else if(view.n==='form'){
  var r=view.id?db[view.t].filter(function(x){return x.id===view.id})[0]:{data:today()};
  h='<div style="--c:'+T.c+'"><div class="bar"><button class="back" aria-label="Voltar" onclick="go(\'list\',\''+view.t+'\')">‹</button><h1>'+(view.id?'Editar':'Novo')+' registro</h1></div>';
  T.fields.forEach(function(f){h+='<label for="f_'+f[0]+'">'+f[1]+'</label>'+(f[2]==='area'?'<textarea id="f_'+f[0]+'">'+esc(r[f[0]])+'</textarea>':'<input id="f_'+f[0]+'" type="'+f[2]+'" value="'+esc(r[f[0]])+'">')});
  h+='<button class="btn" onclick="saveRec()">Salvar registro</button></div>';
 }else if(view.n==='view'){
  var r2=db[view.t].filter(function(x){return x.id===view.id})[0];
  if(!r2){go('list',view.t);return}
  h='<div style="--c:'+T.c+'"><div class="bar"><button class="back" aria-label="Voltar" onclick="go(\'list\',\''+view.t+'\')">‹</button><h1>'+T.label+'</h1></div>';
  T.fields.forEach(function(f){if(r2[f[0]])h+='<div class="field"><h3>'+f[1]+'</h3><p>'+esc(f[2]==='date'?fmt(r2[f[0]]):r2[f[0]])+'</p></div>'});
  h+='<button class="btn" onclick="share()">Compartilhar</button><button class="btn alt" onclick="go(\'form\',\''+view.t+'\','+r2.id+')">Editar</button><button class="btn del" onclick="del()">Excluir</button></div>';
 }
 a.innerHTML=h;if(view.n==='list')list();
}
function card(t,r){var T=TYPES[t];return '<button class="rec" style="--c:'+T.c+'" onclick="go(\'view\',\''+t+'\','+r.id+')"><span class="d">'+T.label+' · '+fmt(r.data)+'</span><b>'+esc(T.title(r))+'</b><p>'+esc(r[T.sub])+'</p></button>'}
function list(){var rs=sorted(view.t).filter(function(r){return !q||JSON.stringify(r).toLowerCase().indexOf(q.toLowerCase())>-1});
 var h='';rs.forEach(function(r){h+=card(view.t,r)});
 if(!rs.length)h='<div class="empty">'+(q?'Nenhum registro encontrado para essa busca.':'Nenhum registro ainda. Toque em “Novo registro” para começar.')+'</div>';
 document.getElementById('res').innerHTML=h}
function saveRec(){var T=TYPES[view.t],r=view.id?db[view.t].filter(function(x){return x.id===view.id})[0]:{id:Date.now()};
 T.fields.forEach(function(f){r[f[0]]=document.getElementById('f_'+f[0]).value.trim()});
 if(!view.id)db[view.t].push(r);save();toast('Registro salvo');go('view',view.t,r.id)}
function del(){if(!confirm('Excluir este registro? Essa ação não pode ser desfeita.'))return;
 db[view.t]=db[view.t].filter(function(x){return x.id!==view.id});save();go('list',view.t)}
function share(){var T=TYPES[view.t],r=db[view.t].filter(function(x){return x.id===view.id})[0],s='*'+T.label+'*\n';
 T.fields.forEach(function(f){if(r[f[0]])s+='\n*'+f[1]+':* '+(f[2]==='date'?fmt(r[f[0]]):r[f[0]])});
 if(navigator.share){navigator.share({text:s}).catch(function(e){if(!e||e.name!=='AbortError')box(s)})}else{box(s)}}
function box(s){var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(10,12,35,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50';
 o.innerHTML='<div style="background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:480px"><h3 style="margin-bottom:10px">Compartilhar</h3><textarea id="sh" readonly style="min-height:180px">'+esc(s)+'</textarea><a class="btn" style="display:block;text-align:center;text-decoration:none;--c:#1faa59" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(s)+'">Abrir no WhatsApp</a><button class="btn alt" id="cp">Copiar texto</button><button class="btn alt" id="cl">Fechar</button></div>';
 document.body.appendChild(o);
 document.getElementById('cl').onclick=function(){o.remove()};
 document.getElementById('cp').onclick=function(){var t=document.getElementById('sh');t.select();try{document.execCommand('copy');toast('Texto copiado')}catch(e){toast('Selecione o texto e copie.')}}}
function backup(){try{var b=new Blob([JSON.stringify(db)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='momentos-com-deus-backup.json';a.click();toast('Backup gerado')}catch(e){toast('Não foi possível gerar o backup.')}}
function restore(i){var f=i.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);for(var k in db)db[k]=o[k]||[];save();toast('Backup restaurado');render()}catch(e){toast('Arquivo de backup inválido.')}};rd.readAsText(f)}
load();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
